<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>💖 Un correo para ti by myeya 💖</title>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: "Poppins", sans-serif;
      background-color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
      color: #333;
      transition: background-color 0.5s ease;
    }
    h2 {
      margin-bottom: 20px;
    }
    .screen {
      display: none;
      animation: fadeIn 0.8s ease;
      width: 90%;
      max-width: 600px;
    }
    .active {
      display: block;
    }
    .main-img {
      width: 280px;
      height: auto;
      margin-bottom: 15px;
      cursor: pointer;
      transition: transform 0.3s ease;
      border: none;
      box-shadow: none;
    }
    .main-img:hover {
      transform: scale(1.05);
    }
    .card {
      background: repeating-linear-gradient(
        white,
        white 28px,
        #e3e3e3 29px
      );
      border-radius: 0;
      padding: 40px 60px;
      border: 2px solid #e5e5e5;
      width: 95%;
      max-width: 900px;
      text-align: left;
      margin: 0 auto;
      box-sizing: border-box;
      box-shadow: 0 0 15px rgba(0,0,0,0.1);
      animation: fadeIn 1s ease;
    }
    .card h3 {
      font-family: 'Dancing Script', cursive;
      font-size: 2em;
      text-align: left;
      margin-bottom: 20px;
      margin-left: 10px;
      color: #444;
    }
    .card p {
      font-family: 'Dancing Script', cursive;
      font-size: 1.3em;
      line-height: 1.6;
      text-align: justify;
      color: #444;
      margin: 10px 0;
    }
    .return-btn {
      margin-top: 25px;
      padding: 10px 20px;
      font-size: 1em;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: 0.3s;
      background-color: #ff4f81;
      color: white;
    }
    .return-btn:hover {
      background-color: #ff2a66;
    }
    @keyframes fadeIn {
      from {opacity: 0; transform: scale(0.95);}
      to {opacity: 1; transform: scale(1);}
    }
  </style>
</head>
<body>

  <div class="screen active" id="screen1">
    <h2>편지가 도착했어요 💌</h2>
    <img src="https://i.pinimg.com/736x/ff/f5/09/fff50907173be3563c30d60e1baa6cbc.jpg" alt="Correo" class="main-img" onclick="nextScreen(2)">
  </div>

  <div class="screen" id="screen2">
    <h2>당신에게 전하는 작은 편지 </h2>
    <img src="https://i.pinimg.com/736x/08/8a/d8/088ad89bd98763783954b4aa5b957f89.jpg" alt="Carta" class="main-img" onclick="nextScreen(3)">
  </div>

  <div class="screen" id="screen3">
   <h2>열어 보세요!</h2>
    <img src="https://i.pinimg.com/736x/0b/97/89/0b978918f0efa0174a6e72d67f2c442a.jpg" alt="Sobre" class="main-img" onclick="nextScreen(4)">
  </div>

  <div class="screen" id="screen4">
    <h2>무슨 내용일까요? 💌</h2>
    <img src="https://i.pinimg.com/736x/40/0d/cf/400dcf7b1230e9e6ca787fa30a66c924.jpg" alt="Carta lista" class="main-img" onclick="nextScreen(5)">
  </div>

  <div class="screen" id="screen5">
    <div class="card">
    <h3>생일 축하해, 윤호! 🎉🎂</h3>

    
    <p>
        오늘 정말 행복하고 아름다운 하루를 보내길 바라.
    </p>

    <p>
        새로운 한 해가 너에게 좋은 일들만 가득하길 진심으로 바랄게.
    </p>

    <p>
        소중한 사람들과 함께 즐거운 시간을 보내고,
        오늘을 마음껏 즐기길 바라.
    </p>

    <p>많은 애정을 담아,</p>

    <p>Naye 💌</p>
</div>

    <div style="text-align: center;">
      <button class="return-btn" onclick="nextScreen(1)">🔙 Regresar</button>
    </div>
  </div>

  <script>
    function nextScreen(num) {
      const current = document.querySelector(".screen.active");
      if (current) current.classList.remove("active");
      document.getElementById("screen" + num).classList.add("active");
    }
  </script>

</body>
</html>
